services:
  backend:
    build: ./backend
    restart: always
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    volumes:
      - watch_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  watch_data:
