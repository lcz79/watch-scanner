server {
    listen 80;
    server_name watchscanner.it www.watchscanner.it;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy tutte le chiamate /api/* verso il backend (rimuove /api)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # HTML e manifest: mai in cache (il browser richiede sempre la versione aggiornata)
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash nel nome (JS/CSS): cache lunga — il hash cambia ad ogni build
    location ~* \.(js|css|woff2?|ttf|svg|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React SPA: qualsiasi route non trovata → index.html
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
