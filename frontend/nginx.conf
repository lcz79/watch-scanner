server {
    listen 80;
    server_name watchscanner.it www.watchscanner.it;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy tutte le chiamate /api/* verso il backend (rimuove /api)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # React SPA: qualsiasi route non trovata → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
